<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Stillpoint AI Companion</title>
    <style>
      body {
        width: 280px;
        margin: 0;
        padding: 16px;
        background: #19201c;
        color: #e5ece6;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 12px;
      }
      .head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-bottom: 12px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        margin-bottom: 14px;
      }
      .brand {
        font-weight: 700;
        font-size: 14px;
        letter-spacing: -0.3px;
        color: #ffffff;
      }
      .brand span { color: #cf7955; }
      .status-pill {
        font-size: 9px;
        background: rgba(61, 168, 114, 0.2);
        color: #4cd48a;
        padding: 2px 7px;
        border-radius: 10px;
        font-family: monospace;
      }
      .setting-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
      }
      .label {
        font-size: 11px;
        color: #9da59d;
      }
      select, button {
        font: inherit;
      }
      select {
        background: #232c27;
        color: #ffffff;
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 4px;
        padding: 4px 8px;
        font-size: 11px;
      }
      .btn {
        width: 100%;
        padding: 8px 0;
        border-radius: 6px;
        font-size: 11px;
        font-weight: 600;
        cursor: pointer;
        border: 1px solid transparent;
        margin-top: 6px;
        transition: all 0.15s ease;
      }
      .btn-primary {
        background: #295441;
        color: #ffffff;
        border-color: #3da872;
      }
      .btn-primary:hover {
        background: #346c53;
      }
      .btn-secondary {
        background: #232c27;
        color: #d1d8cf;
        border-color: rgba(255, 255, 255, 0.12);
      }
      .btn-secondary:hover {
        background: #2d3832;
      }
      .footer-note {
        margin-top: 14px;
        padding-top: 10px;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        font-size: 10px;
        color: #7b837a;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <div class="head">
      <div class="brand">STILLPOINT<span>.AI</span></div>
      <div class="status-pill">V2 COMPANION</div>
    </div>

    <div class="setting-row">
      <span class="label">Detection Sensitivity</span>
      <select id="sel-sensitivity">
        <option value="strict">Strict (Assessment)</option>
        <option value="standard" selected>Standard (Interview)</option>
        <option value="relaxed">Relaxed (Discussion)</option>
      </select>
    </div>

    <div class="setting-row">
      <span class="label">HUD Auto-Attach</span>
      <select id="sel-autohud">
        <option value="enabled" selected>Enabled</option>
        <option value="disabled">Disabled</option>
      </select>
    </div>

    <button class="btn btn-primary" id="btn-open-dash">Open Full Dashboard (Localhost)</button>
    <button class="btn btn-secondary" id="btn-open-meet">Open Google Meet</button>

    <div class="footer-note">
      Automatically attaches to candidate video tiles when you join any call on <strong>meet.google.com</strong>.
    </div>

    <script src="popup.js"></script>
  </body>
</html>
